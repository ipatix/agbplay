# Warning: Artificial Incompetence (AI) ahead...
name: Nightly Release

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-commits:
    name: Check for recent commits
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for recent commits
        id: check-commits
        shell: bash
        run: |
          TODAY=$(TZ=UTC date -u '+%Y-%m-%dT00:00:00Z')
          COMMITS=$(git log --since="$TODAY" --format="%H" 2>/dev/null || echo "")
          if [ -z "$COMMITS" ]; then
            echo "No commits since midnight UTC today. Skipping."
            echo "has-new-commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found $(echo "$COMMITS" | wc -l) commit(s) since midnight UTC."
            echo "has-new-commits=true" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      has-new-commits: ${{ steps.check-commits.outputs.has-new-commits }}

  build:
    name: Build Windows
    needs: check-commits
    if: needs.check-commits.outputs.has-new-commits == 'true'
    uses: ./.github/workflows/build-windows.yml

  create-release:
    name: Create Nightly Release
    needs:
      - build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}

      - name: Zip Build Artifacts
        shell: bash
        run: |
          TODAY=$(date -u '+%Y%m%d')
          zip -r "${{ needs.build.outputs.artifact-name }}-nightly-${TODAY}.zip" agbplay/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Nightly agbplay ${{ github.ref_name }} ($(date -u '+%Y-%m-%d'))
          tag_name: nightly-$(date -u '+%Y%m%d')-${{ github.sha }}
          generate_release_notes: true
          files: "*-nightly-*.zip"
          draft: false
          prerelease: true
